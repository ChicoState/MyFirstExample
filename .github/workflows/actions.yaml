name: Build C++

on:
  push:
    branches: "**"
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  install:
    runs-on: ubuntu-24.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y -f build-essential g++ cmake
  build:
    needs: install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build project
        run: g++ -std=c++17 main.cpp